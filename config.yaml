# TextRP Chatbot Configuration
# Copy this file to config_local.yaml and update with your settings

# TextRP Homeserver Configuration
textrp_connection:
  homeserver: "https://synapse.textrp.io"  # TextRP homeserver
  username: "@r9bFNqztApDV9iFM237FkEHrCUmcPgt5yz:synapse.textrp.io"   # Bot's TextRP ID
  device_name: "Farah Faucet Bot"     # Device display name
  room_id: "!farah-faucet:synapse.textrp.io" # Default room to join

# TextRP Configuration
textrp:
  server_url: "https://backend.textrp.io"  # TextRP API endpoint

# XRPL Configuration
xrpl:
  network: "mainnet"  # Options: mainnet, testnet, devnet
  rpc_url: "https://xrplcluster.com"  # XRPL RPC endpoint

# Bot Configuration
bot:
  command_prefix: "!"           # Command prefix for bot commands
  admin_users:                  # TextRP user IDs of bot administrators
    - "@rfdmLaLLtBzHUrq2SjtnZemY39XM9jPYwL:synapse.textrp.io"
    - "@r9637RuQhx7GVx6xYmtgEyaR4V31xxnvAY:synapse.textrp.io"
    - "@rMLwBUc2HZjfwvJLabFinEnCYEpdn9PAYF:synapse.textrp.io"
